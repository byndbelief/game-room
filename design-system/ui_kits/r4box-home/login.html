<script type="text/babel">
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
function App() {
  const q = () => window.matchMedia('(max-width: 700px)').matches;
  const [m, setM] = React.useState(q);
  React.useEffect(() => { const f = () => setM(q()); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f); }, []);
  return <FunTree mobile={m} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
