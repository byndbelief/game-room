<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>r4box cockpit 1c: diary tree</title>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="diary-tree-data.js"></script>
<script src="diary-tree.js"></script>
<style>body{margin:0}a{color:var(--teal)}a:hover{color:var(--mint)}.opt{position:absolute;background:var(--r4-bg);overflow:hidden;color:var(--r4-ink);font-family:var(--font-body)}.d{top:80px;width:1280px;height:800px;border-radius:12px}.m{top:80px;width:390px;height:844px;border-radius:28px}.badge{position:absolute;top:24px;white-space:nowrap;font:700 20px/1 var(--font-display);color:var(--r4-ink);display:flex;gap:12px;align-items:baseline}.badge span{font:400 15px/1 system-ui;color:var(--r4-muted)}.opt>div{height:100%}</style>
</head><body>
<section>
<div class="badge" id="2a" style="left:0">2a<span>Curve and diary tree together</span></div>
<div class="opt d" data-screen-label="2a Curve + tree" style="left:0"><div id="a"></div></div>
<div class="opt m" data-screen-label="2a mobile" style="left:1320px"><div id="am"></div></div>
<div class="badge" id="2b" style="left:1800px">2b<span>Diary tree only</span></div>
<div class="opt d" data-screen-label="2b Tree only" style="left:1800px"><div id="b"></div></div>
<div class="opt m" data-screen-label="2b mobile" style="left:3120px"><div id="bm"></div></div>
</section>
<script type="text/babel" src="cockpit-shared.jsx"></script>
<script type="text/babel" src="CockpitC.jsx"></script>
<script type="text/babel">
[['a', 'both', 0], ['am', 'both', 1], ['b', 'tree', 0], ['bm', 'tree', 1]].forEach(([id, bg, m]) => ReactDOM.createRoot(document.getElementById(id)).render(<CockpitC bg={bg} mobile={!!m} />));
</script>
</body></html>
