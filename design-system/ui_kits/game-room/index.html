<!-- @dsCard group="Game room" viewport="1280x900" name="Game room (games.r4box.com)" subtitle="Login → lobby → Battleship → scoreboard" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>r4box · game room</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg-page);background-attachment:fixed;padding:20px 16px 40px;min-height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Lobby.jsx"></script>
<script type="text/babel" src="Battleship.jsx"></script>
<script type="text/babel" src="Scoreboard.jsx"></script>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('r4kit.screen') || 'login');
  const go = (s) => { setScreen(s); localStorage.setItem('r4kit.screen', s); window.scrollTo(0, 0); };
  if (screen === 'login') return <Login onIn={() => go('lobby')} />;
  if (screen === 'battleship') return <Battleship go={go} />;
  if (screen === 'stats') return <Scoreboard go={go} />;
  if (screen === 'quick') return <Practice go={go} />;
  return <Lobby go={go} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
