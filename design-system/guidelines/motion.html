<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--r4-bg)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:112px}.sw i{display:block;height:64px;border-radius:12px;border:1px solid #ffffff14}.sw b{font:700 13px var(--font-body)}.sw code{font:12px var(--font-mono);color:var(--r4-muted)}.lbl{font:12px var(--font-mono);color:var(--r4-muted)}</style></head><body><div style="display:flex;gap:26px;align-items:center;justify-content:center;height:120px"><span style="font:400 40px/.95 var(--font-display);color:#FFE08A;-webkit-text-stroke:3px #3A1D00;paint-order:stroke fill;text-shadow:0 6px 0 #3A1D00,0 0 40px #F2C230">HIT!</span><span style="font:400 40px/.95 var(--font-display);color:#FF6B5E;-webkit-text-stroke:3px #2A0000;paint-order:stroke fill;text-shadow:0 6px 0 #2A0000,0 0 40px #FF5A4E">SUNK!</span><span style="font:400 40px/.95 var(--font-display);color:#BDE7FF;-webkit-text-stroke:3px #0A2238;paint-order:stroke fill;text-shadow:0 6px 0 #0A2238,0 0 40px #5AB8FF">SPLASH</span><span style="font:400 40px/.95 var(--font-display);color:#E3CCFF;-webkit-text-stroke:3px #22103A;paint-order:stroke fill;text-shadow:0 6px 0 #22103A,0 0 40px #B37BFF">PEEK</span></div></body></html>
