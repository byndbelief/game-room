<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--r4-bg)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:112px}.sw i{display:block;height:64px;border-radius:12px;border:1px solid #ffffff14}.sw b{font:700 13px var(--font-body)}.sw code{font:12px var(--font-mono);color:var(--r4-muted)}.lbl{font:12px var(--font-mono);color:var(--r4-muted)}</style></head><body><div class="row" style="gap:22px;padding:6px"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><i style="width:96px;height:64px;border-radius:16px;background:var(--r4-panel);border:1px solid var(--r4-line);box-shadow:0 10px 24px #0003"></i><span class="lbl">hover</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><i style="width:96px;height:64px;border-radius:16px;background:var(--r4-panel);border:1px solid var(--r4-line);box-shadow:0 10px 34px #3DD6C64d"></i><span class="lbl">cta glow</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><i style="width:96px;height:64px;border-radius:16px;background:var(--r4-panel);border:1px solid var(--r4-line);box-shadow:0 0 0 2px var(--gold)"></i><span class="lbl">selected</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><i style="width:96px;height:64px;border-radius:16px;background:var(--r4-panel);border:1px solid var(--r4-line);box-shadow:0 0 0 3px #3DD6C655, 0 10px 24px #0006"></i><span class="lbl">picked</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><i style="width:96px;height:64px;border-radius:16px;background:var(--r4-panel);border:1px solid var(--r4-line);box-shadow:0 0 0 1px #3DD6C61a inset, 0 30px 60px #00000080"></i><span class="lbl">hero</span></div></div></body></html>
