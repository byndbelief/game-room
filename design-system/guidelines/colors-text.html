<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--r4-bg)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:112px}.sw i{display:block;height:64px;border-radius:12px;border:1px solid #ffffff14}.sw b{font:700 13px var(--font-body)}.sw code{font:12px var(--font-mono);color:var(--r4-muted)}.lbl{font:12px var(--font-mono);color:var(--r4-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--r4-ink)"></i><b>ink</b><code>#F3F1FF</code></div><div class="sw"><i style="background:var(--r4-muted)"></i><b>muted</b><code>#ACA5D6</code></div><div class="sw"><i style="background:var(--r4-code)"></i><b>code</b><code>#8A83B8</code></div><div class="sw"><i style="background:var(--r4-faint)"></i><b>faint</b><code>#7A73A8</code></div><div class="sw"><i style="background:var(--teal-ink)"></i><b>teal-ink</b><code>#062A26</code></div></div></body></html>
